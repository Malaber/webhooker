name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Black
        run: python -m black --check .
      - name: Mypy
        run: python -m mypy webhooker
      - name: Pytest with coverage
        run: python -m pytest

  version:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')
    uses: Malaber/github-workflows/.github/workflows/reusable-version.yml@main
    with:
      seed_version: "0.3.0"

  prepare-release:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')
    needs:
      - version
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp release version into release source commit
        uses: Malaber/github-workflows/.github/actions/stamp-version@main
        with:
          version: ${{ needs.version.outputs.release_version }}
          replacements: >-
            [{"path":"pyproject.toml","pattern":"^version = \"[^\"]+\"$","replacement":"version = \"{version}\""},{"path":"galaxy.yml","pattern":"^version:\\s*[^\\n]+$","replacement":"version: {version}"},{"path":"roles/webhooker/defaults/main.yml","pattern":"^webhooker_collection_version:\\s*\"[^\"]+\"$","replacement":"webhooker_collection_version: \"{version}\""}]
      - name: Commit stamped release source
        id: prepare
        env:
          RELEASE_GIT_TAG: ${{ needs.version.outputs.git_tag }}
          IS_PUSH_EVENT: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_PUSH_EVENT" = "true" ]; then
            if git diff --quiet; then
              source_sha="$GITHUB_SHA"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "chore: stamp release metadata for ${{ needs.version.outputs.release_version }}"
              source_sha="$(git rev-parse HEAD)"
              git push origin "HEAD:refs/heads/release-source/${{ github.run_id }}"
            fi
            git tag -f "$RELEASE_GIT_TAG" "$source_sha"
            git push origin "refs/tags/$RELEASE_GIT_TAG" --force
          else
            source_sha="$GITHUB_SHA"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  build-docker:
    needs:
      - version
      - prepare-release
    if: (github.event_name != 'push' || github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')) && (github.event_name != 'push' || needs.prepare-release.outputs.ready == 'true')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp release version into build metadata
        uses: Malaber/github-workflows/.github/actions/stamp-version@main
        with:
          version: ${{ needs.version.outputs.release_version }}
          replacements: >-
            [{"path":"pyproject.toml","pattern":"^version = \"[^\"]+\"$","replacement":"version = \"{version}\""},{"path":"galaxy.yml","pattern":"^version:\\s*[^\\n]+$","replacement":"version: {version}"},{"path":"roles/webhooker/defaults/main.yml","pattern":"^webhooker_collection_version:\\s*\"[^\"]+\"$","replacement":"webhooker_collection_version: \"{version}\""}]
      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}/webhooker" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ${{ steps.image.outputs.image }}:sha-${{ needs.prepare-release.outputs.source_sha }}
            ${{ needs.version.outputs.prerelease == 'true' && format('{0}:{1}', steps.image.outputs.image, needs.version.outputs.release_version) || '' }}

  release-ansible-collection:
    if: always() && (github.event_name == 'push' && needs.prepare-release.outputs.ready == 'true') && (github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')) && (needs.version.outputs.prerelease == 'true' || needs.test.result == 'success')
    needs:
      - test
      - version
      - prepare-release
    uses: Malaber/github-workflows/.github/workflows/reusable-ansible-collection-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      python_version: "3.14"
      source_sha: ${{ needs.prepare-release.outputs.source_sha }}
      release_version: ${{ needs.version.outputs.release_version }}
      git_tag: ${{ needs.version.outputs.git_tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      stamp_replacements: >-
        [{"path":"pyproject.toml","pattern":"^version = \"[^\"]+\"$","replacement":"version = \"{version}\""},{"path":"galaxy.yml","pattern":"^version:\\s*[^\\n]+$","replacement":"version: {version}"},{"path":"roles/webhooker/defaults/main.yml","pattern":"^webhooker_collection_version:\\s*\"[^\"]+\"$","replacement":"webhooker_collection_version: \"{version}\""}]
      artifact_name: malaber-webhooker-${{ needs.version.outputs.release_version }}

  release:
    if: always() && (github.event_name == 'push' && needs.prepare-release.outputs.ready == 'true') && (github.actor != 'github-actions[bot]' || !startsWith(github.event.head_commit.message, 'Release v')) && (needs.version.outputs.prerelease == 'true' || needs.test.result == 'success')
    needs:
      - test
      - version
      - prepare-release
      - build-docker
      - release-ansible-collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote Docker image
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease == 'true' }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            docker buildx imagetools create \
              ${{ needs.build-docker.outputs.image }}:sha-${{ needs.prepare-release.outputs.source_sha }} \
              --tag ${{ needs.build-docker.outputs.image }}:${{ needs.version.outputs.release_version }}
          else
            docker buildx imagetools create \
              ${{ needs.build-docker.outputs.image }}:sha-${{ needs.prepare-release.outputs.source_sha }} \
              --tag ${{ needs.build-docker.outputs.image }}:${{ needs.version.outputs.release_version }} \
              --tag ${{ needs.build-docker.outputs.image }}:latest
          fi
